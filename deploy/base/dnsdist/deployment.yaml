apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsdist
  namespace: dns
  labels:
    app.kubernetes.io/name: dnsdist
    app.kubernetes.io/component: dns-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dnsdist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dnsdist
        app.kubernetes.io/component: dns-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Image default user is "pdns" (uid/gid 953); pin it numerically so the
        # kubelet can enforce runAsNonRoot (a non-numeric image user cannot be
        # verified as non-root). Port 53 is bound via the NET_BIND_SERVICE
        # capability granted on the container below.
        runAsUser: 953
        runAsGroup: 953
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dnsdist
          image: powerdns/dnsdist-19:1.9.15@sha256:af0a812fedd2d24cb54c7058cc7b07ca643b44bbf543fe9ae826fc5c663b0801
          args:
            - --config
            - /etc/dnsdist/dnsdist.conf
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: console
              containerPort: 5199
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/dnsdist
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # Required to bind port 53 as non-root
                - NET_BIND_SERVICE
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: dnsdist-config
