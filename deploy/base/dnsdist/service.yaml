apiVersion: v1
kind: Service
metadata:
  name: dnsdist
  namespace: dns
  labels:
    app.kubernetes.io/name: dnsdist
    app.kubernetes.io/component: dns-frontend
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: dnsdist
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
