apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns-recursor
  namespace: dns
  labels:
    app.kubernetes.io/name: pdns-recursor
    app.kubernetes.io/component: dns-recursor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pdns-recursor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdns-recursor
        app.kubernetes.io/component: dns-recursor
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Image default user is "pdns" (uid/gid 953); pin it numerically so the
        # kubelet can enforce runAsNonRoot (a non-numeric image user cannot be
        # verified as non-root). Port 53 is bound via the NET_BIND_SERVICE
        # capability granted on the container below.
        runAsUser: 953
        runAsGroup: 953
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pdns-recursor
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pdns-recursor
          image: powerdns/pdns-recursor-52:5.2.11@sha256:f2eb999df70d6035898aa6e4c427199fa3c1bcad6a53adc41cab7603e4e121cd
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ -z "$PDNS_AUTH_SERVICE_HOST" ]; then
                echo "PDNS_AUTH_SERVICE_HOST is not set" >&2
                exit 1
              fi
              sed "s/__PDNS_AUTH_SERVICE_HOST__/$PDNS_AUTH_SERVICE_HOST/g" \
                /etc/pdns-recursor-template/recursor.conf > /etc/pdns-recursor/recursor.conf
              exec pdns_recursor --enable-old-settings --config-dir=/etc/pdns-recursor
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 8082
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/pdns-recursor-template
              readOnly: true
            - name: generated-config
              mountPath: /etc/pdns-recursor
            - name: run
              mountPath: /run/pdns-recursor
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # Required to bind port 53 as non-root
                - NET_BIND_SERVICE
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: pdns-recursor-config
        - name: generated-config
          emptyDir: {}
        - name: run
          emptyDir: {}
