apiVersion: v1
kind: Service
metadata:
  name: pdns-recursor
  namespace: dns
  labels:
    app.kubernetes.io/name: pdns-recursor
    app.kubernetes.io/component: dns-recursor
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8082"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pdns-recursor
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: metrics
      port: 8082
      targetPort: metrics
      protocol: TCP
