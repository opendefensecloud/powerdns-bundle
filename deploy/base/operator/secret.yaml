# API key used by the Operator to authenticate against the PowerDNS Auth HTTP API.
#
# !! DEVELOPMENT DEFAULT — NOT A PRODUCTION VALUE !!
# `changeme` is a well-known placeholder shared by the bundled examples and the
# CI validation scripts. Any deployment reachable by untrusted clients MUST
# override it before the Authoritative Server is exposed.
#
# The value here and the `api-key` setting in the pdns-auth-config ConfigMap are
# two halves of the same credential: if they differ, the Operator cannot manage
# zones and every Zone/RRset reconciliation fails with HTTP 401. Change both, or
# neither.
#
# Generate a strong key:
#   openssl rand -hex 32
#
# Override without editing this file (kustomize overlay):
#   secretGenerator:
#     - name: pdns-operator-api-key
#       behavior: replace
#       literals:
#         - api-key=<generated-key>
#
# For production, source the key from a secret manager (External Secrets
# Operator, Vault, SOPS) instead of committing it to Git.
apiVersion: v1
kind: Secret
metadata:
  name: pdns-operator-api-key
  namespace: dns
  labels:
    app.kubernetes.io/name: pdns-operator
    app.kubernetes.io/component: dns-operator
type: Opaque
stringData:
  api-key: changeme
