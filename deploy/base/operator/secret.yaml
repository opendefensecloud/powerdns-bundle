# API key used by the Operator to authenticate against the PowerDNS Auth HTTP API.
# Value must match the `api-key` setting in the pdns-auth-config ConfigMap.
# Replace with a proper secret manager or external-secrets integration before production use.
apiVersion: v1
kind: Secret
metadata:
  name: pdns-operator-api-key
  namespace: dns
  labels:
    app.kubernetes.io/name: pdns-operator
    app.kubernetes.io/component: dns-operator
type: Opaque
stringData:
  api-key: changeme
