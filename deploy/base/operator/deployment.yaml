apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns-operator
  namespace: dns
  labels:
    app.kubernetes.io/name: pdns-operator
    app.kubernetes.io/component: dns-operator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pdns-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdns-operator
        app.kubernetes.io/component: dns-operator
    spec:
      serviceAccountName: pdns-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: ghcr.io/telekom/powerdns-operator:sha-b6cc86a@sha256:4e84a237f4b30e912c5e5a4cfe615eeaf11f4c102c64e5f46c0867ed6348af6c
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
          env:
            - name: PDNS_API_URL
              value: "http://pdns-auth:8081"
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pdns-operator-api-key
                  key: api-key
            # Scope the manager cache to the operator's own namespace so the
            # ServiceAccount's namespaced grants are the effective ceiling
            # even if a cluster-wide ClusterRole is ever added later.
            - name: WATCH_NAMESPACE
              value: "dns"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
