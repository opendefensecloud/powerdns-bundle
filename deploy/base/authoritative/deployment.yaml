apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns-auth
  namespace: dns
  labels:
    app.kubernetes.io/name: pdns-auth
    app.kubernetes.io/component: dns-auth
spec:
  replicas: 1
  # Recreate is required: the ReadWriteOnce PVC (pdns-auth-data) cannot be mounted
  # by two pods simultaneously, so a RollingUpdate would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pdns-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdns-auth
        app.kubernetes.io/component: dns-auth
      annotations:
        # Bump when the LMDB/Lightning Stream contract changes so existing
        # pods restart and load the new ConfigMaps.
        powerdns.cav.enablers.ob/lmdb-config-revision: "ls-v2-map-1000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 953
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: repair-lmdb-permissions
          image: powerdns/lightningstream:1.0.3@sha256:b8698c930fe347e55c307adeb7950d5c249410ec0f7460f96d955a8bf706852d
          command:
            - /bin/sh
            - -c
          args:
            - chown -R 953:953 /var/lib/powerdns
          volumeMounts:
            - name: data
              mountPath: /var/lib/powerdns
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pdns-auth
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pdns-auth
          image: powerdns/pdns-auth-49:4.9.16@sha256:272fe174990ce108461ed3e953b43691509cdcfb138d8c7c61f64d7a61b8e6ad
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: api
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/powerdns
              readOnly: true
            - name: data
              mountPath: /var/lib/powerdns
            - name: run
              mountPath: /run/pdns-auth
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 953
            runAsGroup: 953
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

        - name: lightningstream
          image: powerdns/lightningstream:1.0.3@sha256:b8698c930fe347e55c307adeb7950d5c249410ec0f7460f96d955a8bf706852d
          args:
            - sync
            - --config
            - /etc/lightningstream/lightningstream.yaml
            # Lightning Stream requires a unique instance name, which is part of
            # every snapshot filename. It must also be *stable*: a name derived
            # from the pod name changes on every restart, so each rollout would
            # register a new instance whose final snapshot lingers until
            # storage.cleanup.remove_old_instances_interval elapses. The
            # Deployment is pinned to a single replica (Recreate + RWO PVC), so
            # the namespace uniquely and stably identifies this instance.
            # If replicas ever exceed 1, this must become per-pod again.
            - --instance
            - pdns-auth-$(POD_NAMESPACE)
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: ls-metrics
              containerPort: 8500
              protocol: TCP
          volumeMounts:
            - name: lightningstream-config
              mountPath: /etc/lightningstream
              readOnly: true
            - name: data
              mountPath: /var/lib/powerdns
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              # Half the LMDB map size (1000 MB -> 500Mi): Lightning Stream
              # buffers snapshots in memory while merging. Keep in step with
              # the derived limit in the KRO RGD (checked by
              # hack/validate-lmdb-config.sh).
              memory: 500Mi
          securityContext:
            runAsUser: 953
            runAsGroup: 953
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Probes deliberately test the HTTP listener only, not /healthz.
          # /healthz turns unhealthy after a sustained storage outage; gating
          # readiness on it would pull a still-serving authoritative server out
          # of the Service and turn degraded replication into a DNS outage.
          # Replication health is alerted on via /metrics instead
          # (see docs/OPERATIONS.md).
          livenessProbe:
            tcpSocket:
              port: ls-metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: ls-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: pdns-auth-config
        - name: lightningstream-config
          configMap:
            name: lightningstream-config
        - name: data
          persistentVolumeClaim:
            claimName: pdns-auth-data
        - name: run
          emptyDir: {}
