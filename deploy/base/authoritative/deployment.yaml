apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns-auth
  namespace: dns
  labels:
    app.kubernetes.io/name: pdns-auth
    app.kubernetes.io/component: dns-auth
spec:
  replicas: 1
  # Recreate is required: the ReadWriteOnce PVC (pdns-auth-data) cannot be mounted
  # by two pods simultaneously, so a RollingUpdate would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pdns-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdns-auth
        app.kubernetes.io/component: dns-auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 953
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: repair-lmdb-permissions
          image: powerdns/lightningstream:1.0.2@sha256:31acb91faadda5ddb5fc03073cd464cecbce7be0f752d70a39ef2ebb0065539f
          command:
            - /bin/sh
            - -c
          args:
            - chown -R 953:953 /var/lib/powerdns
          volumeMounts:
            - name: data
              mountPath: /var/lib/powerdns
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pdns-auth
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pdns-auth
          image: powerdns/pdns-auth-49:4.9.16@sha256:272fe174990ce108461ed3e953b43691509cdcfb138d8c7c61f64d7a61b8e6ad
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: api
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/powerdns
              readOnly: true
            - name: data
              mountPath: /var/lib/powerdns
            - name: run
              mountPath: /run/pdns-auth
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 953
            runAsGroup: 953
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

        - name: lightningstream
          image: powerdns/lightningstream:1.0.2@sha256:31acb91faadda5ddb5fc03073cd464cecbce7be0f752d70a39ef2ebb0065539f
          args:
            - sync
            - --config
            - /etc/lightningstream/lightningstream.yaml
            - --instance
            - $(POD_NAME)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: lightningstream-config
              mountPath: /etc/lightningstream
              readOnly: true
            - name: data
              mountPath: /var/lib/powerdns
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsUser: 953
            runAsGroup: 953
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # livenessProbe / readinessProbe: not applicable — sidecar exposes no health endpoint

      volumes:
        - name: config
          configMap:
            name: pdns-auth-config
        - name: lightningstream-config
          configMap:
            name: lightningstream-config
        - name: data
          persistentVolumeClaim:
            claimName: pdns-auth-data
        - name: run
          emptyDir: {}
