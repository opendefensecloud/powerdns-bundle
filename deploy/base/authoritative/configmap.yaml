apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-auth-config
  namespace: dns
data:
  pdns.conf: |
    launch=lmdb
    lmdb-filename=/var/lib/powerdns/pdns.lmdb
    # Required for Lightning Stream compatibility; PowerDNS 4.9 removed the
    # previous mapasync sync mode and requires a single shard in this mode.
    lmdb-lightning-stream=yes
    lmdb-shards=1
    # Match Lightning Stream's LMDB map_size (MB, unit-less here) so both
    # processes can open the same environment. Keep this numerically
    # identical to both `map_size` values in configmap-lightningstream.yaml
    # (checked by hack/validate-lmdb-config.sh); KRO deployments derive both
    # from the single lmdbMapSizeMB schema field instead.
    lmdb-map-size=1000

    # API Configuration
    # Enabling the HTTP API allows the PowerDNS Operator to manage zones and records.
    api=yes
    # !! DEVELOPMENT DEFAULT — NOT A PRODUCTION VALUE !!
    # `changeme` is a well-known placeholder shared by the bundled examples and
    # the CI validation scripts. Override it before exposing this instance.
    # This value must stay identical to `api-key` in the pdns-operator-api-key
    # Secret (deploy/base/operator/secret.yaml) — a mismatch makes every
    # Operator reconciliation fail with HTTP 401. Generate one with:
    #   openssl rand -hex 32
    # SUGGESTION: Move api-key to a Kubernetes Secret and inject via ENV or volume.
    api-key=changeme

    # Webserver Configuration
    # The webserver provides the endpoint for the HTTP API.
    webserver=yes
    webserver-address=0.0.0.0
    webserver-port=8081
    # Broad application-level ACL. This is NOT the effective exposure boundary:
    # reachability of port 8081 is constrained by the NetworkPolicies in
    # deploy/base/network-policies/ (operator + a namespace labelled
    # network-policy/monitoring=true only), and the Service is ClusterIP.
    # Tighten to the pod CIDR via an overlay for defense-in-depth — see
    # docs/OPERATIONS.md §6.4.
    webserver-allow-from=0.0.0.0/0,::/0

    # Runtime directories
    # With readOnlyRootFilesystem the default /var/run is not writable.
    socket-dir=/run/pdns-auth
