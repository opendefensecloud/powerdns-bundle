apiVersion: v1
kind: Service
metadata:
  name: pdns-auth
  namespace: dns
  labels:
    app.kubernetes.io/name: pdns-auth
    app.kubernetes.io/component: dns-authoritative
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8081"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pdns-auth
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: api
      port: 8081
      targetPort: api
      protocol: TCP
    # Lightning Stream sync metrics (/metrics) and health (/healthz).
    - name: ls-metrics
      port: 8500
      targetPort: ls-metrics
      protocol: TCP
