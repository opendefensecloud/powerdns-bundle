  # --- lightningstream: Debian OpenSSL/libssl in the image base ---
  - id: CVE-2026-45447
    # HIGH in libssl3t64,openssl,openssl-provider-legacy (lightningstream)
    statement: >-
      Debian OpenSSL/libssl CVE in the lightningstream image base; no rebuilt upstream tag/digest published as of 2026-07-06. DoS/UAF in TLS code paths — lightningstream is a TLS client to the S3/HTTPS object store, not a server for untrusted input. Time-boxed pending upstream image rebuild.
    expired-at: 2026-08-05
