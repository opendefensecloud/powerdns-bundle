# Trivy vulnerability allowlist (image CVE scan)
#
# Policy: every entry below is a HIGH/CRITICAL, fix-available finding that
# originates in a third-party module or base image we do not build ourselves,
# and for which no patched upstream image/digest was published as of
# 2026-08-05 (verified by scanning the latest available tags). Each suppression
# is time-boxed via `expired-at`; once expired the finding re-fails the gate and
# must be re-triaged (bump the image digest or renew with fresh justification).
#
# The dnsdist / pdns-recursor / pdns-authoritative base-image CVEs previously
# listed here were cleared on 2026-07-06 by bumping to rebuilt upstream patch
# images (dnsdist 1.9.16, pdns-recursor 5.2.11, pdns-auth 4.9.16), which all
# scan clean. The PowerDNS Operator image was refreshed again on 2026-08-24
# (rebuild against the current golang:1.26 patch release) and scans clean.
# Lightning Stream was bumped to 1.0.3 the same day, which cleared its Go
# stdlib findings but the base image still carries the x/crypto findings
# below plus a handful of new findings (golang.org/x/net, util-linux) with
# no upstream-rebuilt tag available yet; all are suppressed below pending a
# future Lightning Stream release.
#
# Review/renewal date: 2026-09-05
vulnerabilities:
  # --- lightningstream: golang.org/x/crypto (SSH) compiled into the binary ---
  - id: CVE-2026-39831
    # HIGH in golang.org/x/crypto (lightningstream)
    statement: >-
      golang.org/x/crypto/ssh CVE compiled into the lightningstream binary; lightningstream replicates via S3/HTTPS, not SSH, so the vulnerable SSH code paths are not exercised. Fixed by the next upstream rebuild.
